[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-ai"
version = "0.4.0"
description = "AI multi-stage performance analysis pipeline: static performance review of a codebase with no code execution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
perf-ai = "src.cli.main:app"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.report" = ["templates/*.j2"]
"src.pipeline.stages" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live_api'"
markers = [
    "live_api: tests that call the real Anthropic API and spend tokens; excluded from routine runs, invoke explicitly with: pytest -m live_api --override-ini addopts=''",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
